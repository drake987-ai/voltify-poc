<!doctype html>
<html lang="vi" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>Voltify PoC Sandbox</title>
    <script>
      // Apply the saved theme before first paint to avoid a dark/light flash.
      (function () {
        try {
          var t = localStorage.getItem('voltify.theme');
          if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
          var l = localStorage.getItem('voltify.lang');
          if (l === 'vi' || l === 'en') document.documentElement.setAttribute('lang', l);
        } catch (e) {
          /* storage unavailable: keep defaults */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
